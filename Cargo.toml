[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
aes-gcm = "0.10"
anyhow = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
base64 = "0.22"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand = "0.9"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }
thiserror = "2"
time = "0.3"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "request-id", "set-header", "limit", "sensitive-headers", "timeout", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono", "preserve_order"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

pehle-db = { path = "crates/pehle-db" }
pehle-nexconn = { path = "crates/pehle-nexconn" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
